######################################################################
# Backtest tool V2 configuration — Crypto Top-50
#
# Based on backtest.yaml, adapted for crypto market.
# Uses BTC_ETH_EQ as benchmark (synthetic equal-weight BTC+ETH).
######################################################################

# Annual scaler: Crypto 7×24 trading → 365 days
ann_scaler: 365

# Global random seed (for reproducibility)
random_seed: 42

experiment:
  name: "backtest_v2_crypto"
  recorder: "backtest_v2_recorder"
  output_dir: "data/results/backtest_v2_results"
  output_metrics_file: "backtest_metrics.json"

######################################################################
# 1. Factor source (factor_source)
######################################################################

factor_source:
  # Crypto only supports custom factors
  type: "custom"

  custom:
    json_files: []
    quality_filter: null
    max_factors: null
    use_llm_for_incompatible: true

  combined:
    official_source: "alpha158_20"
    include_custom: true

######################################################################
# 2. Data and market (data)
######################################################################

data:
  provider_uri: "E:\\py\\github_QuantaAlpha\\QuantaAlpha\\data\\qlib\\crypto_50"
  region: "cn"
  market: "crypto_50"
  start_time: "2020-03-06"
  end_time: "2025-06-06"

######################################################################
# 3. Dataset and preprocessing (dataset)
######################################################################

dataset:
  label: "Ref($close, -2) / Ref($close, -1) - 1"

  learn_processors:
    - class: "Fillna"
      kwargs:
        fields_group: "feature"
    - class: "ProcessInf"
    - class: "DropnaLabel"
    - class: "CSRankNorm"
      kwargs:
        fields_group: "feature"
    - class: "CSRankNorm"
      kwargs:
        fields_group: "label"

  infer_processors:
    - class: "Fillna"
      kwargs:
        fields_group: "feature"
    - class: "ProcessInf"
    - class: "CSRankNorm"
      kwargs:
        fields_group: "feature"
    - class: "CSRankNorm"
      kwargs:
        fields_group: "label"

  segments:
    train: ["2020-03-06", "2022-12-31"]
    valid: ["2023-01-01", "2023-12-31"]
    test:  ["2024-01-01", "2025-06-06"]

######################################################################
# 4. Model (model)
######################################################################

model:
  type: "lgb"
  params:
    loss: "mse"
    learning_rate: 0.1
    max_depth: 8
    num_leaves: 210
    colsample_bytree: 0.8879
    subsample: 0.8789
    lambda_l1: 205.6999
    lambda_l2: 580.9768
    num_threads: 20
    seed: 42
    random_state: 42
    early_stopping_round: 50
    num_boost_round: 500
    min_child_samples: 100
    feature_fraction_bynode: 0.8

######################################################################
# 5. Backtest and portfolio (backtest)
######################################################################

backtest:
  strategy:
    class: "TopkDropoutStrategy"
    module_path: "qlib.contrib.strategy"
    kwargs:
      signal: "<PRED>"
      topk: 20
      n_drop: 3

  backtest:
    start_time: "2024-01-01"
    end_time: "2025-06-06"
    account: 100000000
    benchmark: "BTC_ETH_EQ"
    exchange_kwargs:
      codes: "crypto_50"
      limit_threshold: 1.0
      trade_unit: 1
      deal_price: "open"
      open_cost: 0.001
      close_cost: 0.001
      min_cost: 5

######################################################################
# 6. LLM (for custom factor computation)
######################################################################

llm:
  enabled: true
  timeout: 300
  max_retries: 3
  cache_results: true
  cache_dir: "data/results/factor_cache"
  auto_extract_cache: false
  debug: false

######################################################################
# 7. Factor calculation
######################################################################

factor_calculation:
  output_dir: "data/results/computed_factors"
  save_intermediate: true
  n_jobs: 4
  data_file: null  # When null, data is fetched from qlib
