# =============================================================================
# QuantaAlpha crypto backtest config
#
# 基于 conf_baseline.yaml，针对加密货币（50 币日线）调整：
#   - provider_uri 指向 data/qlib/crypto_50
#   - market/benchmark 改为 crypto_50 / BTCUSDT
#   - 日期范围对齐实际数据（2020-03-06 ~ 2025-06-06）
#   - limit_threshold=1.0（crypto 无涨跌停）
#   - open/close_cost=0.001（千一，按主流交易所）
#   - ann_scaler=365（crypto 7×24 日线，年化用 365）
#   - topk=20（50 币中选 top 20）
#
# 切换方式：
#   跑 A 股：不设置 QLIB_RUNNER_CONFIG，或设为 conf_baseline.yaml
#   跑 crypto：set QLIB_RUNNER_CONFIG=conf_crypto.yaml
# =============================================================================

qlib_init:
    provider_uri: "E:\\py\\github_QuantaAlpha\\QuantaAlpha\\data\\qlib\\crypto_50"
    region: cn

market: &market crypto_50
benchmark: &benchmark BTCUSDT

data_handler_config: &data_handler_config
    start_time: 2020-03-06
    end_time:   2025-06-06
    instruments: *market
    data_loader:
        class: qlib.contrib.data.loader.QlibDataLoader
        kwargs:
            config:
                feature:
                    - ["($close-$open)/$open", "$volume/Mean($volume, 20)", "($high-$low)/Ref($close, 1)", "$close/Ref($close, 1)-1"]
                    - ["OPEN_RET", "VOL_RATIO", "RANGE_RET", "CLOSE_RET"]
                label:
                    - ["Ref($close, -2)/Ref($close, -1) - 1"]
                    - ["LABEL0"]

    learn_processors:
        - class: Fillna
          kwargs:
              fields_group: feature
        - class: ProcessInf
        - class: DropnaLabel
        - class: CSRankNorm
          kwargs:
              fields_group: feature
        - class: CSRankNorm
          kwargs:
              fields_group: label

    infer_processors:
        - class: Fillna
          kwargs:
              fields_group: feature
        - class: ProcessInf
        - class: CSRankNorm
          kwargs:
              fields_group: feature
        - class: CSRankNorm
          kwargs:
              fields_group: label

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 20
            n_drop: 3
    backtest:
        start_time: 2024-01-01
        end_time: 2025-06-06
        account: 1000000
        benchmark: *benchmark
        exchange_kwargs:
            codes: *market
            limit_threshold: 1.0
            deal_price: open
            open_cost: 0.001
            close_cost: 0.001
            min_cost: 5

task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.05
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 8
            seed: 42
            random_state: 42
            early_stopping_round: 50
            num_boost_round: 200

    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: DataHandlerLP
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2020-03-06, 2022-12-31]
                valid: [2023-01-01, 2023-12-31]
                test:  [2024-01-01, 2025-06-06]

    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 365
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config
